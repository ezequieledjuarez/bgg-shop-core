"""
A Core-owned conversation. Ownership is derived from the validated execution
principal and is never supplied as a caller-controlled owner ID. Registered
buyers use the current bearer-authenticated user, which remains authoritative
when present. For anonymous calls, the Core transport adapter validates the
BFF-signed HMAC-SHA256 assertion supplied only through the internal
X-Chat-Assertion header, then derives ownership exclusively from its validated
sub claim. The assertion has alg=HS256, typ=chat-assertion, iss=bgg-shop-bff,
aud=bgg-shop-core, scope=chat:conversations, iat, and exp=iat+60s; sub is the
SHA-256 digest of the browser chat_session cookie, never its raw value. A
dedicated CHAT_ASSERTION_SECRET environment setting is shared by BFF and Core
and is distinct from JWT SECRET_KEY and OPKEY_INTERNAL_SECRET. The header is
not a GraphQL argument or browser-supplied payload. Assertions are short-lived
and scoped, but are not one-time credentials and do not promise replay
prevention. Rotate the key by coordinated BFF/Core environment replacement.
Operation-key delegation does not identify an anonymous buyer.
"""
type ChatConversation {
  id: ID!
  messages: [ChatMessage!]!
  createdAt: String!
  updatedAt: String!
  expiresAt: String!
}

type ChatConversationError {
  code: ChatConversationErrorCode!
  message: String!
  field: [String!]
}

type ChatConversationPayload {
  conversation: ChatConversation
  userErrors: [ChatConversationError!]!
}

type DeleteChatConversationPayload {
  success: Boolean!
  userErrors: [ChatConversationError!]!
}

type Query {
  hello: String
  me: User
  """
  Returns a conversation only when it belongs to the validated execution
  principal. For anonymous requests, the transport adapter validates
  X-Chat-Assertion before exposing its subject as the principal. A bearer token
  remains authoritative when present. Missing, expired, and other-scope IDs
  all return NOT_FOUND without exposing conversation metadata. No owner ID or
  assertion is accepted as a GraphQL argument.
  """
  chatConversation(id: ID!): ChatConversationPayload!
  productBySlug(slug: String!): ProductDetail
  productByBggId(bggId: Int!): ProductDetail
  productCategories: [String!]!
  products(
    page: Int = 1
    # Default pageSize changed from 20 to 50 to align BFF defaults and admin UX requirements
    pageSize: Int = 50
    search: String
    yearPublished: Int
    minPlayers: Int
    maxPlayers: Int
    categoryId: Int
    categoryName: String
    priceMin: Float
    priceMax: Float
  ): ProductPage
  cart(cartId: ID): Cart!
  myWishlist: [Product!]!
  myOrders: [PurchaseOrder!]!
  myOrder(id: ID!): PurchaseOrder
  """Returns the authenticated buyer's ARS balance, or zero if no credit exists."""
  myCredit: CreditBalancePayload!
  """
  Lists any existing account, including inactive users and existing superusers.
  Requires a bearer-authenticated active isSuperuser=true user loaded from the
  current database state on every request; isStaff is not required. Token role
  claims do not authorize access. Staff-only, inactive and operation-key-only
  callers are FORBIDDEN; missing/invalid authentication is UNAUTHENTICATED.
  These GraphQL extensions.code values map to BFF HTTP 403 and 401 respectively.
  Only User fields are selectable; credentials and authentication secrets are
  never returned. Optional search has 1-200 characters and is a case-insensitive
  substring match over email, firstName and lastName. cursor is an opaque signed
  nextCursor (1-512 characters); omit it for the first page. Results are ordered
  by user ID ascending and the cursor continues after the last user ID.
  limit defaults to 50, range 1-100.
  Invalid inputs/cursors use extensions.code INVALID and extensions.field,
  mapped to HTTP 400. Error messages are sanitized and never contain
  upstream/internal details.
  """
  adminUsers(search: String, cursor: String, limit: Int = 50): AdminUserPage!
  adminOpSessions(userId: ID, page: Int = 1, pageSize: Int = 50): OperationSessionPage!
  adminPaymentReviews(page: Int = 1, pageSize: Int = 50): PaymentReviewPage!
  """
  Requires an authenticated active staff or superuser identity. An operation
  key without an active user identity is insufficient. Lists non-deleted
  reviews filtered by an optional single status. page is one-based and defaults
  to 1; pageSize defaults to 50 (maximum 100). Results are ordered by createdAt
  DESC then id DESC. Authorization errors use UNAUTHENTICATED or FORBIDDEN.
  """
  adminReviews(status: ReviewModerationStatus, page: Int = 1, pageSize: Int = 50): AdminReviewPage!
  adminPaymentAttempts(page: Int = 1, pageSize: Int = 50): PaymentAttemptPage!
  adminPaymentAttemptObservations(attemptId: ID!, page: Int = 1, pageSize: Int = 50): PaymentAttemptObservationPage!
  adminPaymentAttemptRelease(attemptId: ID!): PaymentAttemptReleasePayload!
  """Requires an active staff or superuser account; an unknown UUID does not prove rejection."""
  adminStockMovementStatus(movementId: ID!): StockMovementStatusPayload!
  """Requires an active staff or superuser account. Lists global and product-specific store promotions but excludes coupon-linked promotion rows. For each product, an eligible specific offer wins over global offers; otherwise the highest eligible global percentage applies. Store promotions do not stack."""
  promotions: [Promotion!]!
  """Requires an active staff or superuser account."""
  adminCoupons: [AdminCoupon!]!
  """
  Requires an active staff or superuser account. Optional exact filters by entity type/ID, actor ID and action; createdFrom/createdTo are inclusive timezone-aware date-times normalized to UTC. Ordered by createdAt DESC, id DESC with an opaque signed cursor; limit defaults to 50 (maximum 100). Invalid filters, limits or cursors fail with extensions.code INVALID and extensions.field; authorization failures use UNAUTHENTICATED or FORBIDDEN.
  """
  adminAuditLogs(entityType: String, entityId: String, actorId: String, action: String, createdFrom: String, createdTo: String, cursor: String, limit: Int = 50): AdminAuditPage!
  """
  Requires an active staff or superuser account. from and to are individually
  optional timezone-aware ISO instants normalized to UTC and define the
  half-open range [from, to). Callers must provide both bounds or omit both;
  if exactly one is supplied, INVALID identifies the missing bound in
  extensions.field. If both are omitted, the range is the last 30 days. The
  maximum range is 366 days. Revenue and ordersCount use paid orders by paid_at;
  payment and dispatch status counts use orders by created_at. Gross revenue
  sums purchase-order line subtotals and may differ from the order total. Exact
  category and product filters include matching lines only; each matching
  order is counted once. Dispatch status is derived at query time from paid_at:
  Pendiente for pending_payment, En preparación before 24 hours, Enviado from
  24 to less than 72 hours, and Entregado at 72 hours or later. pickup orders
  follow the same rule; rejected, cancelled and paid_stock_conflict orders have
  no dispatch status. Invalid input fails with extensions.code INVALID and
  extensions.field; authorization failures use UNAUTHENTICATED or FORBIDDEN.
  """
  adminSalesMetrics(from: String, to: String, categories: [String!], productIds: [Int!]): SalesMetrics!
  """Requires an active staff or superuser account; returns distinct stored category strings for the sales-metrics filter. Authorization failures use UNAUTHENTICATED or FORBIDDEN."""
  adminSalesCategories: [String!]!
  couponByCode(code: String!): Coupon
  availableCoupons: [AvailableCoupon!]!
  """Requires an authenticated user; previews the current cart without reserving or consuming a use."""
  previewCoupon(code: String!): CouponPreview!
  stockReservations(bggId: Int): [StockReservation!]!
}

