type Product {
  bggId: Int!
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
  quantity: Int!
}

type PaymentReview {
  orderId: ID!
  paymentId: ID!
  userId: ID!
  creditOrderId: ID
  detectedAt: String!
  resolution: PaymentReviewResolution
  release: PaymentReviewRelease
}

type PaymentAttempt {
  attemptId: ID!
  orderId: ID!
  userId: ID!
  orderStatus: String!
  preferenceId: ID
}

type PaymentAttemptPage {
  items: [PaymentAttempt!]!
  hasNext: Boolean!
  userErrors: [OrderUserError!]!
}

type PaymentAttemptObservation {
  id: ID!
  attemptId: ID!
  orderId: ID!
  actorId: ID!
  preferenceId: ID
  statement: String!
  recordedAt: String!
}

type PaymentAttemptObservationPage {
  items: [PaymentAttemptObservation!]!
  hasNext: Boolean!
  userErrors: [OrderUserError!]!
}

type RecordPaymentAttemptObservationPayload {
  observation: PaymentAttemptObservation
  userErrors: [OrderUserError!]!
}

type PaymentAttemptRelease {
  attemptId: ID!
  orderId: ID!
  observationId: ID!
  actorId: ID!
  preferenceId: ID
  reason: String!
  riskAcknowledged: Boolean!
  releasedAt: String!
}

type PaymentAttemptReleasePayload {
  release: PaymentAttemptRelease
  providerResponse: PaymentAttemptProviderResponse
  userErrors: [OrderUserError!]!
}

type PaymentAttemptProviderResponse {
  preferenceId: ID!
  recordedAt: String!
}

type PaymentReviewPage {
  items: [PaymentReview!]!
  hasNext: Boolean!
  userErrors: [OrderUserError!]!
}

type PaymentReviewResolution {
  actorId: ID!
  action: String!
  reason: String!
  resolvedAt: String!
}

type PaymentReviewRelease {
  actorId: ID!
  reason: String!
  releasedAt: String!
}

type ReleasePaymentReviewPayload {
  release: PaymentReviewRelease
  userErrors: [OrderUserError!]!
}

type ResolvePaymentReviewPayload {
  resolution: PaymentReviewResolution
  userErrors: [OrderUserError!]!
}

type ProductPage {
  items: [Product!]!
  page: Int!
  pageSize: Int!
  total: Int!
  totalPages: Int!
}

type PublicReview {
  rating: Int!
  body: String!
  createdAt: String!
}

type ReviewSummary {
  approvedReviewCount: Int!
  averageRating: Float
}

type ProductDetail {
  bggId: Int!
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
  quantity: Int!
  reviewSummary: ReviewSummary!
  approvedReviews: [PublicReview!]!
}

type CartLine {
  bggId: Int!
  name: String!
  quantity: Int!
  inventoryQuantity: Int!
  unitPrice: Float!
  subtotal: Float!
}

type Cart {
  cartId: ID!
  lines: [CartLine!]!
  subtotal: Float!
}

type CartUserError {
  field: [String!]
  code: String!
  message: String!
}

type CartPayload {
  cart: Cart!
  userErrors: [CartUserError!]!
}

type Promotion {
  id: ID!
  name: String!
  stackable: Boolean!
  discountPct: Float!
  startsAt: String
  endsAt: String
  createdAt: String!
}

type Coupon {
  id: ID!
  code: String!
  promotion: Promotion
  remaining: BigInt!
  createdAt: String!
}

type StockReservation {
  id: ID!
  bggId: Int!
  reservedQty: Int!
  reason: String
  expiresAt: String
  createdAt: String!
}

type Query {
  hello: String
  me: User
  productBySlug(slug: String!): ProductDetail
  products(
    page: Int = 1
    # Default pageSize changed from 20 to 50 to align BFF defaults and admin UX requirements
    pageSize: Int = 50
    search: String
    yearPublished: Int
    minPlayers: Int
    maxPlayers: Int
    categoryId: Int
    priceMin: Float
    priceMax: Float
  ): ProductPage
  cart(cartId: ID): Cart!
  myWishlist: [Product!]!
  myOrders: [PurchaseOrder!]!
  myOrder(id: ID!): PurchaseOrder
  """Returns the authenticated buyer's ARS balance, or zero if no credit exists."""
  myCredit: CreditBalancePayload!
  adminPaymentReviews(page: Int = 1, pageSize: Int = 50): PaymentReviewPage!
  adminPaymentAttempts(page: Int = 1, pageSize: Int = 50): PaymentAttemptPage!
  adminPaymentAttemptObservations(attemptId: ID!, page: Int = 1, pageSize: Int = 50): PaymentAttemptObservationPage!
  adminPaymentAttemptRelease(attemptId: ID!): PaymentAttemptReleasePayload!
  promotions: [Promotion!]!
  couponByCode(code: String!): Coupon
  stockReservations(bggId: Int): [StockReservation!]!
}
input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
}

input LoginInput {
  email: String!
  password: String!
  guestCartId: ID
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  isActive: Boolean!
  isStaff: Boolean!
  isSuperuser: Boolean!
}

type AuthToken {
  token: String
  refreshToken: String
  csrfToken: String
  # One-time operations key (raw) returned at login when the server creates an OpSession.
  # This value is shown only once and should be stored by the client.
  opKey: String
  opKeyExpiresAt: String
  ops: [String]
}

type UserError {
  field: [String!]
  code: String!
  message: String!
}

type RegisterPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

type LoginPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

input CreateReviewInput {
  productSlug: String!
  rating: Int!
  body: String!
}

type ReviewUserError {
  field: [String!]
  code: String!
  message: String!
}

type CreateReviewPayload {
  created: Boolean!
  status: String
  createdAt: String
  userErrors: [ReviewUserError!]!
}

type IssuedGiftCard {
  id: ID!
  code: String!
  amount: String!
  currency: String!
}

type CreateGiftCardPayload {
  giftCard: IssuedGiftCard
  userErrors: [UserError!]!
}

input RedeemGiftCardInput {
  code: String!
  """A UUID scoped to the authenticated buyer and redemption operation."""
  idempotencyKey: String!
}

input CheckoutWithCreditInput {
  shippingMode: ShippingMode!
  address: ShippingAddressInput
  """A UUID scoped to the authenticated buyer and credit checkout operation."""
  idempotencyKey: String!
}

type CreditBalance {
  """Available credit expressed as a decimal string."""
  balance: String!
  """The credit currency is ARS."""
  currency: String!
}

type CreditBalancePayload {
  credit: CreditBalance
  userErrors: [OrderUserError!]!
}

type CreditCheckoutPayload {
  order: PurchaseOrder
  credit: CreditBalance
  userErrors: [OrderUserError!]!
}

type Mutation {
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  addToCart(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  updateCartQuantity(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  removeFromCart(bggId: Int!, cartId: ID): CartPayload!
  addToWishlist(bggId: Int!): Product!
  removeFromWishlist(bggId: Int!): Product!
  createReview(input: CreateReviewInput!): CreateReviewPayload!
  createGiftCard(amount: String!): CreateGiftCardPayload!
  """
  Redeems an unused gift card atomically. Successful results do not expire.
  Recorded rejections expire after 30 days and their keys can be reused.
  While a record exists, a different request with that key conflicts.
  """
  redeemGiftCard(input: RedeemGiftCardInput!): CreditBalancePayload!
  """
  Pays the server-calculated order total atomically with account credit.
  Insufficient credit or stock rejects the purchase without a partial debit.
  A pending Mercado Pago order owned by the buyer blocks a new credit checkout.
  Successful results do not expire. Recorded rejections expire after 30 days
  and their keys can be reused. While a record exists, a different request
  with that key conflicts.
  """
  checkoutWithCredit(input: CheckoutWithCreditInput!): CreditCheckoutPayload!
  checkout(address: ShippingAddressInput, cartId: ID, shippingMode: ShippingMode!): CheckoutPayload!
  retryPayment(orderId: ID!): CheckoutPayload!
  confirmPayment(orderId: ID!, paymentId: ID!): ConfirmPaymentPayload!
  resolvePaymentReview(orderId: ID!, paymentId: ID!, action: String!, reason: String!): ResolvePaymentReviewPayload!
  releasePaymentReview(orderId: ID!, paymentId: ID!, reason: String!): ReleasePaymentReviewPayload!
  recordPaymentAttemptObservation(orderId: ID!, attemptId: ID!, requestId: ID!, statement: String!): RecordPaymentAttemptObservationPayload!
  releasePaymentAttempt(orderId: ID!, attemptId: ID!, observationId: ID!, reason: String!, acknowledgeRisk: Boolean!): PaymentAttemptReleasePayload!
  createProduct(input: CreateProductInput!): CreateProductPayload!
  updateProduct(id: ID!, input: UpdateProductInput!): UpdateProductPayload!
  adjustVariantStock(productId: ID!, variantId: ID!, newStock: Int!): AdjustVariantStockPayload!
  createPromotion(input: CreatePromotionInput!): CreatePromotionPayload!
  updatePromotion(id: ID!, input: UpdatePromotionInput!): UpdatePromotionPayload!
}

