type Product {
  bggId: Int!
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
}

type ProductPage {
  items: [Product!]!
  page: Int!
  pageSize: Int!
  total: Int!
  totalPages: Int!
}

type PublicReview {
  rating: Int!
  body: String!
  createdAt: String!
}

type ReviewSummary {
  approvedReviewCount: Int!
  averageRating: Float
}

type ProductDetail {
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
  reviewSummary: ReviewSummary!
  approvedReviews: [PublicReview!]!
}

type Query {
  productBySlug(slug: String!): ProductDetail
  products(
    page: Int = 1
    pageSize: Int = 20
    search: String
    yearPublished: Int
    minPlayers: Int
    maxPlayers: Int
    categoryId: Int
    priceMin: Float
    priceMax: Float
  ): ProductPage!
}
input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
}

input LoginInput {
  email: String!
  password: String!
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  isActive: Boolean!
}

type AuthToken {
  token: String
  refreshToken: String
  csrfToken: String
}

type UserError {
  field: [String!]
  code: String!
  message: String!
}

type RegisterPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

type LoginPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

input CreateReviewInput {
  productSlug: String!
  rating: Int!
  body: String!
}

type ReviewUserError {
  field: [String!]
  code: String!
  message: String!
}

type CreateReviewPayload {
  created: Boolean!
  status: String
  createdAt: String
  userErrors: [ReviewUserError!]!
}

type Mutation {
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  createReview(input: CreateReviewInput!): CreateReviewPayload!
}
