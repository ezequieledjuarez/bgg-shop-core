type Promotion {
  id: ID!
  name: String!
  """Manual activation state, independent of validity dates; admin changes require an active staff or superuser account."""
  active: Boolean!
  """Store promotions do not stack; an eligible product-specific offer wins over global offers, otherwise the highest eligible global percentage applies. Coupon-linked promotion rows are coupon offers, not global store promotions."""
  stackable: Boolean!
  """Percentage discount from zero through 50, inclusive; at most one active promotion may target a product."""
  discountPct: Float!
  """BGG identifier of the product this promotion applies to; null means a global store offer. An eligible product-specific offer wins for its product; otherwise the highest eligible global percentage applies. Store promotions do not stack, and coupon-linked rows are excluded from store offers."""
  productBggId: Int
  startsAt: String
  endsAt: String
  createdAt: String!
}

type Coupon {
  id: ID!
  """Unique by exact, case-sensitive equality; code is not normalized."""
  code: String!
  promotion: Promotion
  """Number of uses remaining; never negative."""
  remaining: BigInt!
  active: Boolean!
  """UTC validity start, inclusive."""
  startsAt: String
  """UTC validity end, exclusive; when both boundaries exist, startsAt precedes endsAt."""
  endsAt: String
  createdAt: String!
}

"""
Redacted administrative change record. `before` and `after` are JSON objects (or null when absent). Values under keys naming credentials, tokens, passwords, secrets, authorization data, or payment/card data are replaced with "[REDACTED]" before the record is returned.
"""
type AdminAuditRecord {
  id: BigInt!
  actorId: String
  action: String!
  entityType: String
  entityId: String
  createdAt: String!
  before: JSONString
  after: JSONString
}

"""One page of audit records ordered by createdAt DESC, id DESC."""
type AdminAuditPage {
  records: [AdminAuditRecord!]!
  nextCursor: String
}

"""Admin representation of a coupon; the discount is flattened from its product-less promotion."""
type AdminCoupon {
  id: Int!
  code: String!
  discountPercent: Float!
  remaining: BigInt!
  active: Boolean!
  startsAt: String
  endsAt: String
  createdAt: String!
}

type AdminCouponPayload {
  coupon: AdminCoupon
  userErrors: [UserError!]!
}

"""
Read-only estimate for the authenticated user's current cart. The estimate
does not reserve or consume a use. A discount above 50% of the undiscounted
cart subtotal is rejected, not capped. Preserve decimal precision while
calculating each alternative, then round each total upward once to whole
pesos. Select the greater saving; ties favor the store promotion.
"""
type CouponPreview {
  valid: Boolean!
  couponCode: String!
  discountAmount: Float!
  newTotal: Float!
  """Null when the coupon is eligible for the current cart."""
  reason: String
}

type AvailableCoupon {
  code: String!
  startsAt: String!
  endsAt: String!
}

type StockReservation {
  id: ID!
  bggId: Int!
  reservedQty: Int!
  reason: String
  expiresAt: String
  createdAt: String!
}

