type Product {
  bggId: Int!
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
  quantity: Int!
}

type ProductPage {
  items: [Product!]!
  page: Int!
  pageSize: Int!
  total: Int!
  totalPages: Int!
}

type PublicReview {
  rating: Int!
  body: String!
  createdAt: String!
}

type ReviewSummary {
  approvedReviewCount: Int!
  averageRating: Float
}

type ProductDetail {
  name: String!
  releaseYear: Int!
  minPlayers: Int!
  maxPlayers: Int!
  playingTimeMinutes: Int!
  minAge: Int!
  weight: Float!
  category: [String!]!
  price: Float!
  publisher: String!
  imageUrl: String!
  quantity: Int!
  reviewSummary: ReviewSummary!
  approvedReviews: [PublicReview!]!
}

type CartLine {
  bggId: Int!
  name: String!
  quantity: Int!
  inventoryQuantity: Int!
  unitPrice: Float!
  subtotal: Float!
}

type Cart {
  cartId: ID!
  lines: [CartLine!]!
  subtotal: Float!
}

type CartUserError {
  field: [String!]
  code: String!
  message: String!
}

type CartPayload {
  cart: Cart!
  userErrors: [CartUserError!]!
}

type Query {
  hello: String
  productBySlug(slug: String!): ProductDetail
  products(
    page: Int = 1
    pageSize: Int = 20
    search: String
    yearPublished: Int
    minPlayers: Int
    maxPlayers: Int
    categoryId: Int
    priceMin: Float
    priceMax: Float
  ): ProductPage
  cart(cartId: ID): Cart!
  myOrders: [PurchaseOrder!]!
  myOrder(id: ID!): PurchaseOrder
}
input RegisterInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
}

input LoginInput {
  email: String!
  password: String!
  guestCartId: ID
}

type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  isActive: Boolean!
}

type AuthToken {
  token: String
  refreshToken: String
  csrfToken: String
}

type UserError {
  field: [String!]
  code: String!
  message: String!
}

type RegisterPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

type LoginPayload {
  user: User
  tokens: AuthToken
  errors: [UserError!]!
}

input CreateReviewInput {
  productSlug: String!
  rating: Int!
  body: String!
}

type ReviewUserError {
  field: [String!]
  code: String!
  message: String!
}

type CreateReviewPayload {
  created: Boolean!
  status: String
  createdAt: String
  userErrors: [ReviewUserError!]!
}

type Mutation {
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  addToCart(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  updateCartQuantity(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  removeFromCart(bggId: Int!, cartId: ID): CartPayload!
  createReview(input: CreateReviewInput!): CreateReviewPayload!
  checkout(address: ShippingAddressInput, cartId: ID, shippingMode: ShippingMode!): CheckoutPayload!
  retryPayment(orderId: ID!): CheckoutPayload!
  confirmPayment(orderId: ID!, paymentId: ID!): ConfirmPaymentPayload!
}


type PurchaseOrder {
  id: ID!
  status: String!
  total: Float!
  currency: String!
  shippingMode: String!
  recipient: String
  street: String
  city: String
  postalCode: String
  phone: String
  paymentStatus: String
  paymentStatusDetail: String
  createdAt: String!
  paidAt: String
  lines: [OrderLine!]!
  invoice: Invoice
}

type OrderLine {
  bggId: Int!
  name: String!
  unitPrice: Float!
  quantity: Int!
  subtotal: Float!
}

type Invoice {
  number: BigInt!
  issuedAt: String!
  total: Float!
}

"""
The `BigInt` scalar type represents non-fractional whole numeric values.
`BigInt` is not constrained to 32-bit like the `Int` type and thus is a less
compatible type.
"""
scalar BigInt

type CheckoutPayload {
  order: PurchaseOrder
  initPoint: String
  userErrors: [OrderUserError!]!
}

type ConfirmPaymentPayload {
  order: PurchaseOrder
  userErrors: [OrderUserError!]!
}

type OrderUserError {
  field: [String!]
  code: String!
  message: String!
}

input ShippingAddressInput {
  recipient: String
  street: String
  city: String
  postalCode: String
  phone: String
}

enum ShippingMode {
  STANDARD
  PICKUP
}
