type PurchaseOrder {
  id: ID!
  status: String!
  total: Float!
  currency: String!
  shippingMode: String!
  recipient: String
  street: String
  city: String
  postalCode: String
  phone: String
  paymentStatus: String
  paymentStatusDetail: String
  createdAt: String!
  paidAt: String
  lines: [OrderLine!]!
  invoice: Invoice
}

type OrderLine {
  bggId: Int!
  name: String!
  unitPrice: Float!
  quantity: Int!
  subtotal: Float!
}

type Invoice {
  number: BigInt!
  issuedAt: String!
  total: Float!
}

"""
The `BigInt` scalar type represents non-fractional whole numeric values.
`BigInt` is not constrained to 32-bit like the `Int` type and thus is a less
compatible type.
"""
scalar BigInt

type CheckoutPayload {
  order: PurchaseOrder
  initPoint: String
  userErrors: [OrderUserError!]!
}

type ConfirmPaymentPayload {
  order: PurchaseOrder
  userErrors: [OrderUserError!]!
}

type OrderUserError {
  field: [String!]
  code: String!
  message: String!
}

input ShippingAddressInput {
  recipient: String
