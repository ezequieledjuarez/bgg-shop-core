type Mutation {
  register(input: RegisterInput!): RegisterPayload!
  login(input: LoginInput!): LoginPayload!
  """
  Creates a PostgreSQL-backed conversation for the validated execution
  principal, with no owner identifier or assertion in the GraphQL input.
  Anonymous ownership is derived only after the Core transport adapter
  validates the BFF-signed assertion in X-Chat-Assertion; a registered-user
  bearer token remains authoritative when present. Conversation content and
  metadata expire after 30 days of inactivity.
  """
  createChatConversation: ChatConversationPayload!
  """
  Atomically records one in-scope user/assistant exchange in the caller-owned
  conversation and refreshes its 30-day inactivity expiry. The BFF must apply
  the shop-scope and sensitive-content guard before invoking this mutation.
  The user message must be nonblank and no longer than 2,000 characters; the
  BFF supplies only the last 10 prior turns to the model. This mutation does
  not write to or otherwise affect ChromaDB. No owner ID is accepted.
  """
  recordChatExchange(
    conversationId: ID!
    userMessage: String!
    assistantMessage: String!
    sources: [ChatSourceInput!]
  ): ChatConversationPayload!
  """
  Deletes only the caller-owned conversation and its messages from PostgreSQL.
  Unknown, expired, and other-scope IDs return NOT_FOUND. ChromaDB knowledge is
  independent and is never modified by conversation deletion.
  """
  deleteChatConversation(conversationId: ID!): DeleteChatConversationPayload!
  """
  Requires the same current bearer-authenticated active Superadmin authority as
  adminUsers; isStaff is not required and operation-key-only access is forbidden.
  userId is the existing User.id, not an employee or operation-session ID.
  Changes exactly one selected staff or superuser flag to enabled, preserving
  the other privilege and all other account fields. Granting superuser never
  grants staff. privilege must be exactly is_staff or is_superuser. May target
  any existing account, including the actor or an inactive user. Returns saved
  state only after commit; subsequent authorization checks, including
  already-active sessions, use current saved flags.
  Revoking an active user's superuser flag, including self-demotion, is denied
  atomically if no other active superuser would remain. Concurrent revocations
  must preserve this invariant; any failed/denied change makes no partial writes.
  userErrors map UNAUTHENTICATED to HTTP 401, FORBIDDEN (including inactive,
  staff-only and operation-key-only callers) to 403, NOT_FOUND to 404 and INVALID
  to 400. Last-active-superuser denial uses LAST_ACTIVE_SUPERUSER and maps to
  HTTP 409. Errors expose no upstream exceptions, traces, internal URLs,
  credentials or authentication secrets. Existing staff operational
  authorization is unchanged.
  """
  adminUpdateUserPrivilege(userId: ID!, privilege: AdminUserPrivilege!, enabled: Boolean!): AdminUpdateUserPrivilegePayload!
  manageOpSession(sessionId: ID!, action: String!): ManageOperationSessionPayload!
  addToCart(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  updateCartQuantity(bggId: Int!, cartId: ID, quantity: Int!): CartPayload!
  removeFromCart(bggId: Int!, cartId: ID): CartPayload!
  addToWishlist(bggId: Int!): Product!
  removeFromWishlist(bggId: Int!): Product!
  createReview(input: CreateReviewInput!): CreateReviewPayload!
  """
  Requires an authenticated active staff or superuser identity. An operation
  key without an active user identity is insufficient. Core is authoritative
  for state and locks the review row to serialize actions; the last serialized
  action is final. Same-state ACCEPT/REJECT and repeated DELETE are idempotent
  success. Unknown IDs and non-delete actions on soft-deleted reviews report
  REVIEW_NOT_FOUND (mapped to HTTP 404 by the BFF); only a genuinely invalid
  transition reports INVALID_TRANSITION (mapped to HTTP 409). DELETE sets a
  separate soft-delete marker and retains the current moderation status.
  """
  moderateReview(reviewId: ID!, action: ReviewModerationAction!): ModerateReviewPayload!
  createGiftCard(amount: String!): CreateGiftCardPayload!
  """
  Redeems an unused gift card atomically. Successful results do not expire.
  Recorded rejections expire after 30 days and their keys can be reused.
  While a record exists, a different request with that key conflicts.
  """
  redeemGiftCard(input: RedeemGiftCardInput!): CreditBalancePayload!
  """
  Pays the server-calculated order total atomically with account credit.
  Insufficient credit or stock rejects the purchase without a partial debit.
  A pending Mercado Pago order owned by the buyer blocks a new credit checkout.
  Successful results do not expire. Recorded rejections expire after 30 days
  and their keys can be reused. While a record exists, a different request
  with that key conflicts.
  """
  checkoutWithCredit(input: CheckoutWithCreditInput!): CreditCheckoutPayload!
  """
  A supplied coupon is reserved atomically during checkout. Release only after
  confirmed failure or cancellation; uncertain provider outcomes retain the
  reservation for reconciliation and unresolved outcomes require manual review.
  A timeout alone does not release a reservation. Coupon codes are matched by
  exact, case-sensitive equality, without normalization.
  Coupon checkouts require checkoutKey. Retrying the same key with the same
  payload returns the original order; using it for a different payload conflicts.
  """
  checkout(address: ShippingAddressInput, cartId: ID, checkoutKey: String, couponCode: String, shippingMode: ShippingMode!): CheckoutPayload!
  retryPayment(orderId: ID!): CheckoutPayload!
  confirmPayment(orderId: ID!, paymentId: ID!): ConfirmPaymentPayload!
  resolvePaymentReview(orderId: ID!, paymentId: ID!, action: String!, reason: String!): ResolvePaymentReviewPayload!
  releasePaymentReview(orderId: ID!, paymentId: ID!, reason: String!): ReleasePaymentReviewPayload!
  recordPaymentAttemptObservation(orderId: ID!, attemptId: ID!, requestId: ID!, statement: String!): RecordPaymentAttemptObservationPayload!
  releasePaymentAttempt(orderId: ID!, attemptId: ID!, observationId: ID!, reason: String!, acknowledgeRisk: Boolean!): PaymentAttemptReleasePayload!
  """Requires an active staff or superuser account."""
  createProduct(input: CreateProductInput!): CreateProductPayload!
  """Requires an active staff or superuser account."""
  updateProduct(id: ID!, input: UpdateProductInput!): UpdateProductPayload!
  # Legacy mutation rejects updates; use adjustProductStock with a UUID.
  addProductStock(productId: ID!, newStock: Int!): AddProductStockPayload!
  """
  UUID-bound stock movement. Retries with the same product, direction and
  quantity do not duplicate applied work; failed, rejected or no-change
  operations may retry the exact payload indefinitely. Reusing the UUID with
  different movement data rejects. OUT over available stock applies partially
  to zero and reports requested and applied quantities. Requires an active
  staff or superuser account.
  """
  adjustProductStock(productId: ID!, movementId: ID!, direction: StockMovementDirection!, quantity: Int!): AdjustProductStockPayload!
  """Requires an active staff or superuser account."""
  createPromotion(input: CreatePromotionInput!): CreatePromotionPayload!
  """Requires an active staff or superuser account."""
  updatePromotion(id: ID!, input: UpdatePromotionInput!): UpdatePromotionPayload!
  """
  Requires an active staff or superuser account. Coupon creation and its audit
  record commit atomically; the percentage is stored on a product-less promotion.
  """
  createAdminCoupon(input: AdminCreateCouponInput!): AdminCouponPayload!
  """
  Requires an active staff or superuser account. Code is immutable. Coupon
  updates and their audit records commit atomically; deactivation replaces deletion.
  """
  updateAdminCoupon(id: Int!, input: AdminUpdateCouponInput!): AdminCouponPayload!
}

